name: test

# Tiers (Buster 2026-11-20: the suite was too heavy to run whole on every push):
#   fast  - every PR push, drafts included: the prompt lint, rule claims, design, engine (~2 min, no server, no browser)
#   test  - the full suite split across 3 machines by measured minutes (scripts/ci-shard.mjs): on PRs that are ready
#           (not drafts; marking a draft ready runs it), on every push to main, and by hand. Merge gate: all 3 green.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: test-${{ github.ref }}
  # a newer push to a branch or PR supersedes the older run; main runs are never cancelled
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The durable prompts must name the general rule, not past cases (prompt-lint.json lists them; hits fail the job).
      - run: python3 scripts/prompt_lint.py --config prompt-lint.json
      - run: node scripts/ci-shard.mjs --fast

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # ubuntu-latest is 26.04 now, which Playwright 1.58 cannot install Chromium on; pinned to a supported image
    runs-on: ubuntu-24.04
    # Shard 1 takes ~23 min on a normal runner; a slow one ran every suite ~1.5x slower (#77, 2026-11-21) and hit a 30-min cap mid-test.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      # The suite stubs every model call (MODEL_BASE_URL) and every rules fetch; it needs no secret.
      PYTHON: python3
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install playwright==1.58.0

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # the key hashes this file, which pins playwright (the pin names the Chromium build): bumping the pin refreshes the cache
          key: playwright-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml') }}

      - name: Install Chromium (browsers and system libraries)
        run: python -m playwright install --with-deps chromium

      - run: node scripts/ci-shard.mjs ${{ matrix.shard }} 3
