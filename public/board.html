<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promptocracy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&family=Martian+Mono:wdth,wght@87.5..112.5,400..700&family=Grenze+Gotisch:wght@100..900&display=swap">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<header class="gamehead">
  <div class="title"><a href="/">&#9666; promptocracy.us</a><h1 id="title">Promptocracy</h1></div>
  <div class="right" id="who"></div>
  <div class="notif" id="notes-panel" hidden>
    <h3>Notifications</h3>
    <ul class="notes" id="notes"></ul>
  </div>
  <div class="notif acct" id="acct" hidden></div>
</header>
<div class="banner" id="notice" hidden></div>
<div class="loginbar" id="login-panel" hidden>
  <form class="stack" id="login-form">
    <label class="field"><span>Email you joined with</span><input type="email" name="email" required autocomplete="email"></label>
    <button class="btn" type="submit">Email me a log-in link</button>
    <div id="login-msg" role="status"></div>
  </form>
</div>

<!-- the midnight lock: one line over the board while the moderator processes the day (rule 107.1) -->
<section id="lockbar" class="banner locked" role="status" hidden></section>

<!-- the board is a band in the page flow (420 px, 290 on a phone), with the move bar under it and the players beside it -->
<div class="playtop" id="playtop">
  <div class="boardcol">
    <div class="board-wrap" id="board-wrap"><noscript>The board needs JavaScript. The tiles are listed below.</noscript></div>
    <div class="movebar" id="movebar" aria-live="polite"></div>
  </div>
  <aside class="side" aria-label="Players">
    <h3 class="sideh">Players</h3>
    <ul class="players" id="scores"></ul>
  </aside>
</div>
<h2 class="sr-only">Tiles</h2>
<ul class="sr-only" id="tile-list"></ul>

<!-- the book: Summary, Rulebook, Workshop (the tickets, then the catalog), History -->
<section class="rbwrap" id="book" aria-label="Summary, rulebook, workshop and history">
  <div class="book">
    <div class="pzone" id="pzone" aria-label="Your proposals" hidden></div>
    <div class="btabs" id="btabs" role="tablist" aria-label="Book"></div>
    <!-- the tab beside the chat window (public/js/chat.js): a column on a desktop, a corner pill and a sheet on a phone -->
    <div class="bwrap" id="bwrap" data-chat="off" data-sheet="closed">
    <div id="bpanel">
      <div id="p-summary" role="tabpanel" aria-labelledby="tab-summary"></div>
      <div id="p-rules" role="tabpanel" aria-labelledby="tab-rules" hidden><section class="rbwrap" id="rules" aria-label="Rulebook">Loading&hellip;</section></div>
      <div id="p-workshop" role="tabpanel" aria-labelledby="tab-workshop" hidden></div>
      <div id="p-history" role="tabpanel" aria-labelledby="tab-history" hidden></div>
      <div id="p-yours" role="tabpanel" aria-labelledby="tab-yours" hidden></div>
    </div>
    <aside class="chatcol" id="chatcol" aria-label="Chat" hidden></aside>
    <button type="button" class="chatfab" id="chatfab" hidden></button>
    </div>
  </div>
</section>

<!-- the card over a dim backdrop (a rule, a player) -->
<div class="mroot" id="mroot" hidden></div>

<script type="module">
  // One page for every game. The slug is the first path segment; every call goes to /<slug>/api/...
  // The board is drawn from /api/board, the players and the log from /api/game, the rulebook from /api/rules
  // (the game's own repo, fetched by the server). /api/me, /api/day and /api/notifications say who is looking and what they may do.
  // The page is: header (bell, account chip) - the board band, its move bar and the players - the book (tabs).
  // Slots other work fills carry data-slot="...": moon, recap, rule-action, recent-days, history-days, catalog-entries (inside the Workshop tab),
  // player-today, bar-action. They are empty containers here; the CSS hides them while empty. ballot-count and ballot-vote
  // are filled by ballot.js (the Yes / No boxes, drawn in each ballot row and in a rule's card).
  import { ensureDefs } from "/js/pieces.js";
  import { mountRulebook } from "/js/rulebook.js";
  import { createProposer, diffOf } from "/js/propose.js";
  import { createCards } from "/js/cards.js";
  import { createBallot } from "/js/ballot.js";
  import { mini, playerPill, hexOf } from "/js/people.js";
import { rulingsHTML } from "/js/rulings.js";
import { createWorkshop } from "/js/workshop.js";
  import { createYours } from "/js/yours.js";
  import { createHistory } from "/js/history.js";
import { createChat, AGENTS } from "/js/chat.js";
 import { commissionHTML, wPill } from "/js/commission.js";
  const SLUG = location.pathname.split("/")[1] || "";
  const BASE = "/" + SLUG;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
  const $ = id => document.getElementById(id);
  const NOTICES = {
    "joined": "You're in.",
    "welcome-back": "You're logged in.",
    "link-invalid": "That link has expired or was already used. Log in again to get a new one.",
    "no-room": "Couldn't finish joining: there is no room on the map yet for a new piece to start.",
    "join-locked": "Couldn't finish joining: the day is being processed. Open the join link again once it's done.",
    "join-failed": "Couldn't finish joining: that piece color was taken, or the game is full. Open the join link again to pick another color."
  };
  const api = async (path, body) => {
    const res = await fetch(BASE + path, body === undefined ? { cache: "no-store" } : {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    let data = null; try { data = await res.json(); } catch (e) {}
    return { ok: res.ok, status: res.status, data };
  };
  let ME = null, DATA = null, INVITE = null;   // who is looking, and the last /api/game
  let DAY = null, END_ASK = false, START_ASK = false, DAY_AT = 0, DAY_TIMER = 0, DAY_TICK = 0;   // the last /api/day, the End turn confirm, when it was fetched
  let PROP = null, BAL = null, BOOK = null, CARDS = null, WS = null, CHAT = null, STAR = null, YOURS = null, HIST = null;   // the proposal controller (propose.js), the mounted rulebook, the card host
  let BOARD = null, SEL = null, VIEW = null;   // the last /api/board, the selected tile {x,y}, the drawn board
  let TAB = "summary", BOARD_OPEN = true, LASTMOVE = null, NOTES = { list: [], unread: 0 }, RULES_OK = false;
  ensureDefs();

  const myKey = () => (ME && ME.player ? ME.player.color.key : null);
  const players = () => (DATA && DATA.players) || [];
  const shapeOf = c => { const p = players().find(q => q.color.key === c.key); return p ? p.shape : "pawn"; };
  const pill = (by, mine) => !by ? "" : playerPill(by, { you: !!mine || (!!ME && !!ME.player && by.color.key === myKey()), shapeOf });
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const noLevel = l => String(l || "").replace(/ 1U$/, "");   // the ground level is the only one in use: "3N 2E", not "3N 2E 1U"
  const pieceName = k => String(k || "pawn").replace(/[-_]/g, " ").replace(/^./, c => c.toUpperCase());

  function showNotice() {
    const n = new URLSearchParams(location.search).get("notice");
    if (n && NOTICES[n]) { $("notice").textContent = NOTICES[n]; $("notice").hidden = false; }
    if (n) history.replaceState(null, "", BASE + "/");
  }

  // ---- the header: the bell and the account chip (one panel open at a time; click-out and Esc close it) -----------------
  const BELL = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z M10 21h4" style="fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round"/></svg>';
  // Your own invite link (rule 102.3), for a player of this game while it has room: {url}. A full game answers {url: null, reason} (the item shows disabled with the reason); a game that is over, nothing.
  async function loadInvite() {
    INVITE = null;
    if (ME && ME.player) { const r = await api("/api/invite"); INVITE = r.ok && r.data && (r.data.url || r.data.reason) ? { url: r.data.url || null, reason: r.data.reason || "" } : null; }
  }
  async function loadMe() {
    const me = await api("/api/me");
    ME = me.ok ? me.data : null;
    await loadInvite();
    if (PROP) PROP.redraw();
    if (BOOK) BOOK.redraw();
    drawBook();   // the ballot's Yes / No and the Propose card depend on who is looking
    syncChats();   // the chat windows exist only for a signed-in player
    if (VIEW && ME && ME.player) VIEW.setMe(ME.player.color.key);
    drawWho();
    drawMoveBar();
    if (!me.ok) return;
    await loadNotes();
  }
  function drawWho() {
    const w = $("who");
    if (!ME) {
      w.innerHTML = '<button class="btn ghost small" id="login-btn" type="button">Log in</button>';
      $("login-btn").onclick = () => { $("login-panel").hidden = !$("login-panel").hidden; };
      return;
    }
    const p = ME.player, shown = !$("notes-panel").hidden, open = !$("acct").hidden;
    const unread = NOTES.unread;
    w.innerHTML = `<button class="iconbtn" id="bell" type="button" aria-label="${unread ? `Notifications, ${unread} new` : "Notifications"}" aria-expanded="${shown}" aria-controls="notes-panel">${BELL}<span class="badge" id="badge"${unread && !shown ? "" : " hidden"}>${unread}</span></button>
      <button class="me" id="me-chip" type="button" aria-haspopup="true" aria-expanded="${open}" aria-controls="acct" aria-label="Your account">${p ? `<span class="dot" style="background:${hexOf(p.color)};width:20px;height:20px"></span>` : ""}<span class="nm">${esc(ME.user.name)}</span><span class="cv" aria-hidden="true">▾</span></button>`;
    // toggling redraws this header, so the button you used is found again and keeps focus
    $("bell").onclick = () => { toggle("notes"); $("bell").focus(); };
    $("me-chip").onclick = () => { toggle("acct"); $("me-chip").focus(); };
    drawAcct();
  }
  function drawAcct() {
    const p = ME && ME.player;
    $("acct").innerHTML = ME ? `<div class="acct-me">${p ? `<span class="dot" style="background:${hexOf(p.color)};width:22px;height:22px"></span>` : ""}<span><b>${esc(ME.user.name)}</b>${p ? `<small>${esc(p.color.name)} · ${plural(p.score, "point")}</small>` : ""}</span></div>
      ${p ? `<button type="button" class="acct-link" data-pl="${esc(p.color.key)}" data-fromacct="1">Your player card</button>` : ""}
      ${p && INVITE ? `<div class="acct-invite"><span>Invite a friend</span><span class="row"><input id="invite-url" type="text" readonly value="${esc(INVITE.url || "")}"${INVITE.url ? "" : " disabled"} aria-label="Invite a friend: join link"><button type="button" class="btn ghost small" id="invite-copy"${INVITE.url ? "" : " disabled"}>Copy</button></span>${INVITE.url ? "" : `<small class="why">${esc(INVITE.reason)}</small>`}</div>` : ""}
      ${p ? `<button type="button" class="acct-link" data-yours="1">Yours</button>` : ""}
      <button type="button" class="acct-link" id="logout">Log out</button>` : "";
    const ic = $("invite-copy");
    if (ic && INVITE && INVITE.url) ic.onclick = async () => {
      const inp = $("invite-url");
      try { await navigator.clipboard.writeText(INVITE.url); } catch (e) { inp.focus(); inp.select(); try { document.execCommand("copy"); } catch (e2) {} }   // no clipboard (or not allowed): the link is selected to copy by hand
      inp.focus(); inp.select(); ic.textContent = "Copied";
    };
    const lo = $("logout"); if (lo) lo.onclick = async () => { await api("/api/logout", {}); location.reload(); };
  }
  // Opening one closes the other; closing the bell marks what it showed as read (the badge clears when it opens, the tint stays while it is open).
  function toggle(which) {
    const notes = $("notes-panel"), acct = $("acct");
    if (which === "notes") {
      if (!notes.hidden) return closePanels();
      acct.hidden = true; notes.hidden = false;
      drawNotes(); drawWho();
    } else {
      if (!acct.hidden) return closePanels();
      closePanels(); acct.hidden = false; drawWho();
    }
  }
  async function closePanels(focus) {
    const wasNotes = !$("notes-panel").hidden, wasAcct = !$("acct").hidden;
    if (!wasNotes && !wasAcct) return;
    $("notes-panel").hidden = true; $("acct").hidden = true;
    if (wasNotes && NOTES.unread) { NOTES.unread = 0; await api("/api/notifications/read", { all: true }); NOTES.list = NOTES.list.map(n => ({ ...n, read_at: n.read_at || "read" })); }
    drawWho();
    if (focus) { const b = $(wasNotes ? "bell" : "me-chip"); if (b) b.focus(); }
  }
  document.addEventListener("click", e => { if (e.target.isConnected && !e.target.closest(".gamehead")) closePanels(); });   // (a panel button redraws the header, so its own click target may already be gone)
  document.addEventListener("keydown", e => { if (e.key === "Escape" && (!$("notes-panel").hidden || !$("acct").hidden) && !(CARDS && CARDS.isOpen()) && !document.getElementById("rprev")) closePanels(true); });

  // "12:00 am" today, "yesterday", else the date: in the game's time zone, from the event's own time
  function whenText(iso) {
    const t = Date.parse(iso); if (!Number.isFinite(t)) return "";
    const tz = DAY && DAY.timezone;
    const day = d => { try { return new Intl.DateTimeFormat("en-CA", { timeZone: tz || undefined }).format(d); } catch (e) { return new Intl.DateTimeFormat("en-CA").format(d); } };
    const now = new Date(DAY && DAY.now ? Date.parse(DAY.now) : Date.now()), then = new Date(t);
    const a = day(then), b = day(now);
    if (a === b) { try { return new Intl.DateTimeFormat("en-US", { timeZone: tz || undefined, hour: "numeric", minute: "2-digit" }).format(then).toLowerCase(); } catch (e) { return ""; } }
    return a === day(new Date(now.getTime() - 86400000)) ? "yesterday" : a;
  }
  async function loadNotes() {
    const r = await api("/api/notifications");
    if (!r.ok) return;
    NOTES = { list: r.data.notifications, unread: $("notes-panel").hidden ? r.data.unread : NOTES.unread };
    if (!$("notes-panel").hidden) NOTES.list = r.data.notifications.map(n => n);
    drawNotes(); drawWho();
  }
  function drawNotes() {
    $("notes").innerHTML = NOTES.list.length ? NOTES.list.map(n => `<li class="${n.read_at ? "" : "unread"}"><span class="dot" style="background:var(--accent);margin-top:5px"></span><span>${esc(n.body)}<small>${esc(whenText(n.created_at))}</small></span></li>`).join("") : "<li>Nothing yet.</li>";
  }

  $("login-form").addEventListener("submit", async e => {
    e.preventDefault();
    const msg = $("login-msg");
    msg.textContent = "Sending…";
    const r = await api("/api/login", { email: new FormData(e.target).get("email") });
    msg.className = r.ok ? "notice" : "notice err";
    msg.textContent = (r.data && (r.data.message || r.data.error)) || "Something went wrong.";
    if (r.ok && r.data.dev_link) {
      const p = document.createElement("p"); p.className = "dev"; p.append("Dev mode link: ");
      const a = document.createElement("a"); a.href = r.data.dev_link; a.textContent = r.data.dev_link;
      p.append(a); msg.append(p);
    }
  });

  // ---- loading ----------------------------------------------------------------------------------------------------
  async function load() {
    showNotice();
    CARDS = createCards({ root: $("mroot"), describe });   // closing a card keeps what you were writing: it is there when the card opens again
    BAL = createBallot({ api, pill: by => pill(by, false), refreshed: refresh, player: () => !!(ME && ME.player) });
    WS = createWorkshop({ api, me: () => ME, pill, rpill: n => PROP.rpill(n), when: whenText, canCommission: () => PROP.canCommission(), refresh: async () => { await refresh(); loadNotes(); }, cards: CARDS, chat: () => CHAT });
    CHAT = createChat({ api, root: $("bwrap"), me: () => ME, started: () => gameStarted(), slug: SLUG, rpill: n => PROP.rpill(n), wpill: wPill,
      onTicket: async t => { WS.apply(t); await WS.load(); drawBook(); },
      onNew: () => WS.commission(), canNew: () => PROP.canCommission(),
      // "Ask Starling": her window opens with the player's words in its box, unsent (rule 106.3)
      canHandoff: () => handoffOk(),
      onHandoff: async (to, text) => { CARDS.close(); if (TAB !== "rules") setTab("rules"); await STAR.attachRule(null, { open: true }); STAR.prefill(text); } });
    // Starling shares the column and the pill with Gremlin: only the window whose tab is showing draws (public/js/chat.js)
    STAR = createChat({ api, root: $("bwrap"), me: () => ME, started: () => gameStarted(), slug: SLUG, agent: AGENTS.starling, rpill: n => PROP.rpill(n), wpill: wPill,
      onProposals: async () => { await refresh(); loadNotes(); }, onSlip: async () => { await PROP.load(); drawBar(); },
      // "Ask Gremlin": a new draft ticket the way + New starts one (your blank one again), his window on it with the player's words in its box, unsent (rule 106.3)
      canHandoff: () => handoffOk(),
      onHandoff: async (to, text) => { CARDS.close(); if (TAB !== "workshop") setTab("workshop"); await WS.commission(); CHAT.prefill(text); } });
    // her window: a rule card's "Propose a change" puts the card away first, since it would cover her
    PROP = createProposer({ api, me: () => ME, day: () => DAY, pill, vote: n => BAL.box(n), drawBar, goTab: k => { CARDS.close(); setTab(k); },
      starling: () => STAR && ({ ready: () => STAR.ready() && gameStarted(),
        attachRule: async (n, o) => { CARDS.close(); if (TAB !== "rules") setTab("rules"); await STAR.attachRule(n, o); },
        open: async (o = {}) => { CARDS.close(); if (TAB !== "rules") setTab("rules"); if (o.intent) await STAR.attachIntent(o.intent, { open: true }); else await STAR.attachRule(null, { open: true }); } }),
      workshop: () => WS && ({ commission: async () => { CARDS.close(); if (TAB !== "workshop") setTab("workshop"); await WS.click({ dataset: { w: "open" } }); },
        open: async n => { CARDS.close(); if (TAB !== "workshop") setTab("workshop"); await WS.open(n, false); } }),
      refresh: async () => { await refresh(); loadNotes(); } });
    YOURS = createYours({ api, me: () => ME, cardKey: p => PROP.cardKey(p) });
    HIST = createHistory({ api, pill, rpill: n => PROP.rpill(n), pPill: p => PROP.pPill(p), wPill });
    drawTabs(); drawBook();
    loadMe();
    const [g] = await Promise.all([api("/api/game"), loadDay()]);
    if (!g.ok) $("movebar").innerHTML = '<span class="err">No game has been set up yet.</span>';
    else drawGame(g.data);
    // the rulebook shows each rule's settings, so it waits for the board's reply (which carries them)
    const [rules] = await Promise.all([fetch(BASE + "/api/rules").then(async r => { if (!r.ok) throw new Error("rules " + r.status); return r.text(); }).catch(() => null), boardLoaded]);
    await Promise.all([PROP.load(), BAL.load(), WS.load()]);
    if (rules === null) { $("rules").innerHTML = '<p class="err" style="padding:20px 28px">Rules unavailable right now.</p>'; drawBook(); return; }
    BOOK = mountRulebook($("rules"), rules, { settings: (BOARD && BOARD.settings) || {}, proposer: PROP, cards: CARDS, action: ruleAction });
    BOOK.onCount(() => { drawTabs(); drawBook(); });
    RULES_OK = true;
    drawTabs(); drawBook();
    if (location.hash.startsWith("#r-")) { setTab("rules"); BOOK.fromHash(); }
  }

  // ---- the book: tabs, and what each shows --------------------------------------------------------------------------
  const TABS = () => [["summary", "Summary", ""], ["rules", "Rulebook", BOOK && BOOK.count() ? plural(BOOK.count(), "rule") : ""], ["workshop", "Workshop", WS && WS.count() ? plural(WS.count(), "ticket") : ""],
    ["history", "History", DAY && DAY.day ? plural(DAY.day, "day") : ""], ...(TAB === "yours" ? [["yours", "Yours", ""]] : [])];   // Yours is in the row only while it shows: the account menu opens it
  // The propose bar sits above the tabs, on every tab, for a player of a game in play; nobody else has one. @rule 103.1, 103.2
  function drawBar() {
    const el = $("pzone");
    if (!el || !PROP) return;
    const t = turnHTML();
    const html = t && DAY && DAY.status === "over" ? `<section class="tk off" aria-label="Game over">${t.head}</section>` : PROP.barHTML(t);
    if (el.innerHTML !== html) el.innerHTML = html;
    el.hidden = !html;
    syncDayTag();
  }
  // Only someone with no panel (a visitor, a non-player) has "Day N" in the tab row; a player's Day N is in the panel.
  function syncDayTag() {
    const tabs = $("btabs"), tag = tabs.querySelector(".bday"), want = $("pzone").hidden && DAY && DAY.day ? `Day ${DAY.day}` : "";
    if (!want) { if (tag) tag.remove(); return; }
    if (tag) { if (tag.textContent !== want) tag.textContent = want; return; }
    tabs.insertAdjacentHTML("beforeend", `<span class="bday">${esc(want)}</span>`);
  }
  function drawTabs() {
    drawBar();
    $("btabs").innerHTML = TABS().map(([k, n, c]) => `<button type="button" class="btab" role="tab" id="tab-${k}" aria-selected="${TAB === k}" aria-controls="p-${k}" tabindex="${TAB === k ? 0 : -1}" data-tab="${k}">${n}${c ? `<span class="cnt">${esc(c)}</span>` : ""}</button>`).join("");
    syncDayTag();
  }
  // Both chat windows hear about the tab and the day: each one draws only while its own tab is showing
  /** Has the host pressed Start (rule 203.1)? Until the game's state has loaded, no. */
  const gameStarted = () => !!(DATA && DATA.game && DATA.game.status !== "setup");
  /** Can the other helper's window take the player's words now: the turn is open (the same gate as + New and Propose).
   * Whether that helper can be reached or has hit today's cap is only known once its window loads its own state, which
   * may never have happened on this page (or be yesterday's): so the button doesn't guess. It opens the window, which
   * reads its state fresh and shows its own reason (can't be reached, the day's limit) where the player types. @rule 106.3 */
  function handoffOk() {
    const c = PROP.canCommission();
    return c.allowed ? { allowed: true } : { allowed: false, reason: c.reason || "Not available right now." };
  }
  function syncChats(reread) { if (CHAT) CHAT.sync(TAB, reread); if (STAR) STAR.sync(TAB, reread); }
  function setTab(k, scroll) {
    TAB = k;
    for (const t of ["summary", "rules", "workshop", "history", "yours"]) $("p-" + t).hidden = t !== k;
    drawTabs(); drawBook(); syncChats();
    if (k === "history") loadHistory();
    if (scroll) $("book").scrollIntoView({ block: "start", behavior: reduced() ? "auto" : "smooth" });
  }
  /** History's per-day list (history.js): read when the tab opens and on every refresh while it shows. */
  async function loadHistory(more) {
    if (!HIST) return;
    await (more ? HIST.more() : HIST.load());
    if (TAB === "history") drawBook();
  }
  /** The Yours page: your own proposals and tickets in every state (yours.js), reached from the account menu. */
  async function openYours() {
    if (!ME || !ME.player || !YOURS) return;
    await YOURS.load();
    setTab("yours", true);
    const tb = $("tab-yours"); if (tb) tb.scrollIntoView({ block: "nearest", inline: "nearest" });   // a phone's tab row scrolls sideways
  }
  $("btabs").addEventListener("keydown", e => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const ks = TABS().map(t => t[0]), i = ks.indexOf(TAB), n = ks[(i + (e.key === "ArrowRight" ? 1 : ks.length - 1)) % ks.length];

    else if (DAY && DAY.you && DAY.you.ended) lead = `<div class="mb"><span>No move today</span></div>`;
    else if (g && g.status === "setup") lead = `<div class="mb"><span><b>Setting up.</b> ${plural((DATA.players || []).length, "player")} of ${esc(g.max_players)} joined.</span>${ME && ME.player && ME.player.is_host && !START_ASK ? `<button class="btn small" id="start-game" type="button">Start the game</button>` : ""}</div>${ME && ME.player && ME.player.is_host && START_ASK ? `<div class="dask" role="group" aria-label="Start the game"><span class="row"><button type="button" class="btn small" id="start-yes">Start</button><button type="button" class="linkbtn" id="start-no">Not yet</button></span></div>` : ""}`;
    else if (DAY && DAY.locked) lead = `<div class="mb"><span class="hint">The day is being processed.</span></div>`;
    else if (!ME) lead = `<div class="mb"></div>`;
    else if (move.ok) lead = `<div class="mb"><span class="hint">You have not moved today.</span></div>`;   // a state, not an instruction: the dashed tiles say where
    else lead = `<div class="mb"><span class="hint">${esc(move.why || "")}</span></div>`;
    box.innerHTML = lead + `<span class="slot" data-slot="bar-action"></span><span class="mbr"><button class="linkbtn" id="board-toggle" type="button" aria-expanded="${BOARD_OPEN}">${BOARD_OPEN ? "Hide board" : "Show board"}</button></span>`;
    $("playtop").classList.toggle("collapsed", !BOARD_OPEN);
    const sg = $("start-game"); if (sg) sg.onclick = () => { START_ASK = true; drawMoveBar(); const y = $("start-yes"); if (y) y.focus(); };
    const sy = $("start-yes"); if (sy) sy.onclick = () => { START_ASK = false; startGame(sy); };
    const sn = $("start-no"); if (sn) sn.onclick = () => { START_ASK = false; drawMoveBar(); const b = $("start-game"); if (b) b.focus(); };
    const mm = $("make-move"); if (mm) mm.onclick = () => makeMove(pend, mm);
    const um = $("undo-move"); if (um) um.onclick = () => select(null, null);
    $("board-toggle").onclick = () => { BOARD_OPEN = !BOARD_OPEN; drawMoveBar(); };
    if (VIEW && VIEW.setReach) VIEW.setReach(move.ok ? BOARD.tiles.filter(x => x.z === 0 && canMoveTo(x)).map(x => ({ x: x.x, y: x.y })) : []);
  }
  // Start (rules 102.2, 203.1): the host only. The game goes to play and day 1 begins; the page is read again.
  async function startGame(button) {
    button.disabled = true;
    const r = await api("/api/start", {});
    if (r.ok) { await refresh(); return; }
    const text = (r.data && r.data.error) || "Something went wrong.";
    await refresh();
    const m = $("movebar"); const p = document.createElement("p"); p.className = "notice err"; p.setAttribute("role", "alert"); p.textContent = text; m.prepend(p);
  }
  // The move is final at once (one a day, rule 202): the existing move route, then the bar says what happened.
  async function makeMove(t, button) {
    const n = newlyCharted(t);
    button.disabled = true;
    const r = await api("/api/action", { kind: "move", x: t.x, y: t.y, z: t.z });
    if (r.ok) { LASTMOVE = { day: DAY && DAY.day, n }; SEL = null; if (VIEW) VIEW.select(null, null); await refresh(); if (VIEW) VIEW.recenter(myKey()); return; }
    const text = (r.data && r.data.error) || "Something went wrong.";
    SEL = null; if (VIEW) VIEW.select(null, null);
    await refresh();
    const m = $("movebar"); const p = document.createElement("p"); p.className = "notice err"; p.setAttribute("role", "alert"); p.textContent = text; m.prepend(p);
  }
  function select(q, r) {
    // a piece's tile opens that player's card (S1-PLY-03); a tile you may move to is picked (a pending move); any other tile is not
    const t = q == null ? null : tileAt(q, r), here = t ? piecesAt(t) : [];
    if (here.length) { SEL = null; if (VIEW) VIEW.select(null, null); drawMoveBar(); openPlayer(here[0].color.key); return; }
    SEL = q == null ? null : { x: q, y: r };
    if (VIEW) VIEW.select(q, r);
    drawMoveBar();
  }

  function drawBoard(b) {
    BOARD = b;
    if (VIEW) VIEW.setData(b, myKey());
    $("tile-list").innerHTML = b.tiles.filter(t => t.z === 0).map(t => `<li><button type="button" data-x="${t.x}" data-y="${t.y}">${esc("Tile " + t.label + (piecesAt(t).length ? ", " + piecesAt(t).map(p => `${p.name} (${p.color.name})`).join(", ") : ""))}</button></li>`).join("");
    drawMoveBar(); drawBar();
    if (TAB === "summary") drawBook();
  }
  document.addEventListener("click", async e => {
    const g = e.target.closest("[data-give]");
    if (!g || g.disabled) return;
    g.disabled = true;
    const r = await api("/api/give-heart", { player: g.dataset.give });
    await refresh(); await loadDay();
    if (!r.ok) { const c = $("mroot").querySelector(".mcard dl"); if (c) c.insertAdjacentHTML("beforeend", `<p class="notice err" role="alert">${esc((r.data && r.data.error) || "Something went wrong.")}</p>`); }
  });
  $("tile-list").addEventListener("click", e => {
    const b = e.target.closest("button[data-x]");
    if (b) select(Number(b.dataset.x), Number(b.dataset.y));
  });

  async function refresh() {
    const [g, b, me, d] = await Promise.all([api("/api/game"), api("/api/board"), api("/api/me"), api("/api/day")]);
    if (me.ok) ME = me.data; else ME = null;
    await loadInvite();
    if (d.ok) { DAY = d.data; DAY_AT = Date.now(); }
    if (g.ok) { DATA = g.data; }
    if (b.ok) { BOARD = b.data; if (VIEW) VIEW.setData(b.data, myKey()); }
    await Promise.all([PROP ? PROP.load() : 0, BAL ? BAL.load() : 0, WS ? WS.load() : 0, YOURS && TAB === "yours" ? YOURS.load() : 0, HIST && TAB === "history" ? HIST.load() : 0]);
    drawWho(); if (g.ok) drawGame(g.data); if (b.ok) drawBoard(b.data); drawTabs(); drawDay(); drawBook(); drawMoveBar(); syncChats(true);   // the day or the lock changed: the chats read their state again
    if (BOOK) BOOK.redraw();
    if (CARDS && CARDS.isOpen()) CARDS.redraw();
  }

  async function initBoard() {
    const wrap = $("board-wrap");
    try {
      const { createBoard } = await import("/js/board.js");
      VIEW = await createBoard(wrap, { onSelect: select });
      window.__board = VIEW;   // handle for the browser tests
      if (BOARD) VIEW.setData(BOARD, myKey());
      if (SEL) VIEW.select(SEL.x, SEL.y);
      drawMoveBar();
    } catch (e) {
      console.error(e);
      wrap.innerHTML = '<p class="muted" style="padding:12px">The board could not be drawn. The tiles are listed below.</p>';
    }
  }
  const boardLoaded = api("/api/board").then(b => { if (b.ok) drawBoard(b.data); });

  // ---- clicks: tabs, jumps, End turn, pills, players, withdraw ---------------------------------------------------------
  document.addEventListener("click", async e => {
    const t = e.target;
    if (PROP && !t.closest("#pzone .tkstep.pr")) PROP.closeMenu();   // a click anywhere else puts the Propose menu away (first, so a vote or a tab click does too)
    if (t.closest("[data-hmore]")) { await loadHistory(true); return; }
    if (t.closest("[data-yours]")) { await closePanels(); await openYours(); return; }
    const tab = t.closest("[data-tab]");
    if (tab && !tab.disabled) { setTab(tab.dataset.tab, !tab.closest(".btabs")); return; }
    const j = t.closest("[data-jump]");
    if (j) { jumpTo(j.dataset.jump); return; }
    const inCard = CARDS.isOpen();   // with a card up, anything it opens (from its text, or from the preview of one of its pills) goes on its back stack
    const see = t.closest("[data-seecard]");
    if (see && BOOK) {
      if (see.matches(".rpill,.xref,.rref") && !see.dataset.fromprev) { BOOK.preview(see, see.dataset.seecard, see.dataset.clause); return; }
      CARDS.hidePreview();
      BOOK.openRule(see.dataset.seecard, { push: inCard });
      return;
    }
    const pl = t.closest("[data-pl]");
    if (pl && DATA) { CARDS.hidePreview(); if (pl.dataset.fromacct) await closePanels(); openPlayer(pl.dataset.pl, inCard); return; }
    const use = t.closest("[data-muse]");
    if (use) { CARDS.close(); jumpTo("board"); return; }
    const tk = t.closest("[data-ticket]");
    if (tk && WS) { CARDS.hidePreview(); WS.open(tk.dataset.ticket, inCard); return; }
    const en = t.closest("[data-entry]");
    if (en && WS && !en.dataset.w) { CARDS.hidePreview(); WS.openEntry(en.dataset.entry, inCard); return; }
    const wb = t.closest("[data-w]");
    if (wb && WS) { if (!wb.disabled) WS.click(wb); return; }
    const vb = t.closest("[data-vote]");
    if (vb) {
      if (vb.disabled || !BAL) return;
      const where = vb.closest("#mroot, #rules, #p-summary") ? "#" + vb.closest("#mroot, #rules, #p-summary").id : "#p-summary";   // a box lives in the card, the Rulebook tab or the Summary
      await BAL.click(vb);
      const again = document.querySelector(`${where} [data-vote="${vb.dataset.vote}"][data-pn="${vb.dataset.pn}"]`);   // the boxes were drawn again: keep the keyboard where it was
      if (again && !again.disabled) again.focus({ preventScroll: true });
      return;
    }
    const pe = t.closest("#p-summary [data-p], #pzone [data-p]");
    if (pe && PROP && !pe.disabled) { PROP.click(pe); return; }
    const b = t.closest("[data-endturn]");
    if (!b) return;
    if (b.dataset.endturn !== "yes") { END_ASK = b.dataset.endturn === "ask"; drawBar(); if (END_ASK) { const y = document.querySelector('[data-endturn="yes"]'); if (y) y.focus(); } return; }
    b.disabled = true;
    const r = await api("/api/end-turn", {});
    if (r.ok) { END_ASK = false; await refresh(); loadNotes(); return; }
    const text = (r.data && r.data.error) || "Something went wrong.";
    END_ASK = false; await refresh();
    const m = $("day-msg"); if (m) { m.className = "notice err"; m.textContent = text; }
  });

  document.addEventListener("submit", async e => {
    const f = e.target.closest && e.target.closest("[data-eraform]");
    if (!f) return;
    e.preventDefault();
    const btn = f.querySelector("button"), inp = $("era-name"), msg = $("era-msg");
    if (btn.disabled) return;
    btn.disabled = true;
    const r = await api("/api/era", { name: inp.value });
    if (r.ok) { await refresh(); return; }
    btn.disabled = false;
    msg.hidden = false; msg.textContent = (r.data && r.data.error) || "Something went wrong.";
  });
  document.addEventListener("input", e => { if (WS) WS.input(e.target); });
  $("pzone").addEventListener("input", e => PROP && PROP.input(e.target));
  $("pzone").addEventListener("change", e => PROP && PROP.input(e.target));
  document.addEventListener("keydown", e => { if (e.key === "Escape" && PROP) PROP.closeMenu(); });
  initBoard();
  load();
</script>
</body>
</html>
